name: ci

on:
  push:
    branches: [main]
  pull_request:

# The Mint packs are private repositories: Go fetches them straight from
# GitHub with a read-only token kept as the MINT_READ_TOKEN secret.
env:
  GOPRIVATE: github.com/CurtisD4q/*

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Let Go read the Mint packs
        run: git config --global url."https://x-access-token:${{ secrets.MINT_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  emacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - run: emacs -batch -l jobwatch.el -l jobwatch-test.el -f ert-run-tests-batch-and-exit
