name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The shared pmin CI: gofmt, vet, tests with the race detector, staticcheck
# and the layering check. See CurtisD4q/pmin/.github/workflows/go.yml.
jobs:
  go:
    uses: CurtisD4q/pmin/.github/workflows/go.yml@main
    secrets: inherit
    with:
      extra: go build ./...

  emacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - run: emacs -batch -l jobwatch.el -l jobwatch-test.el -f ert-run-tests-batch-and-exit
